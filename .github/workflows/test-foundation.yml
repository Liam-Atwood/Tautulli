name: Jellyfin Port Tests

on:
  push:
    branches: [main, jellyfin-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jellyfin-port-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile first-party Python
        run: python -m compileall -q PlexPy.py Tautulli.py plexpy scripts tests
      - name: Verify Plex coupling inventory
        run: python scripts/audit_plex_coupling.py --check > /dev/null
      - name: Run port suite without network
        run: python -m pytest tests
